<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="cavern" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07120f"/>
      <stop offset=".38" stop-color="#142a20"/>
      <stop offset=".7" stop-color="#2d3321"/>
      <stop offset="1" stop-color="#11120f"/>
    </linearGradient>
    <radialGradient id="heart-glow">
      <stop stop-color="#fffbd0"/>
      <stop offset=".12" stop-color="#dfff79"/>
      <stop offset=".38" stop-color="#69d986" stop-opacity=".82"/>
      <stop offset=".68" stop-color="#2f9d8c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#17362d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-glow">
      <stop stop-color="#fff2bc"/>
      <stop offset=".18" stop-color="#f6c96c"/>
      <stop offset=".52" stop-color="#c67a34" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6a3520" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soil" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#806044"/>
      <stop offset=".35" stop-color="#4a352b"/>
      <stop offset=".72" stop-color="#281e1c"/>
      <stop offset="1" stop-color="#100e0e"/>
    </linearGradient>
    <linearGradient id="resin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5d586"/>
      <stop offset=".25" stop-color="#c88c45"/>
      <stop offset=".65" stop-color="#775037"/>
      <stop offset="1" stop-color="#31251f"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b7450"/>
      <stop offset=".4" stop-color="#4c4730"/>
      <stop offset="1" stop-color="#19231b"/>
    </linearGradient>
    <linearGradient id="chrysalis" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#f6efac"/>
      <stop offset=".2" stop-color="#b9dd68"/>
      <stop offset=".58" stop-color="#4aa772"/>
      <stop offset="1" stop-color="#1a5d5a"/>
    </linearGradient>
    <linearGradient id="ant" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c57b42"/><stop offset=".42" stop-color="#653225"/><stop offset="1" stop-color="#211217"/>
    </linearGradient>
    <linearGradient id="egg" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff6ce"/><stop offset=".42" stop-color="#d5d98f"/><stop offset="1" stop-color="#81966b"/>
    </linearGradient>
    <pattern id="soil-grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="14" r="4" fill="#d1a56d" opacity=".12"/>
      <circle cx="45" cy="43" r="5" fill="#020604" opacity=".3"/>
      <path d="M5 53l19-8m25-34l10-5" stroke="#dfbd86" stroke-width="2" opacity=".08"/>
    </pattern>
    <pattern id="cell-pattern" width="108" height="94" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M27 2h54l27 45-27 45H27L0 47Z" fill="none" stroke="#d3a657" stroke-width="7" opacity=".24"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="far"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="small-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="depth-shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="28"/>
      <feColorMatrix values="0 0 0 0 0.01 0 0 0 0 0.02 0 0 0 0 0.015 0 0 0 .88 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <symbol id="worker-ant" viewBox="-120 -120 240 240">
      <g fill="none" stroke="#261619" stroke-width="15" stroke-linecap="round">
        <path d="M-42-4l-77-42M-45 23l-75 37M42-4l77-42M45 23l75 37"/>
        <path d="M-31 46l-52 70M31 46l52 70"/>
      </g>
      <ellipse cy="55" rx="45" ry="61" fill="url(#ant)" stroke="#1c1115" stroke-width="12"/>
      <ellipse cy="2" rx="39" ry="44" fill="url(#ant)" stroke="#1c1115" stroke-width="12"/>
      <ellipse cy="-48" rx="35" ry="31" fill="url(#ant)" stroke="#1c1115" stroke-width="12"/>
      <path d="M-20-72q-30-38-51-32M20-72q30-38 51-32" fill="none" stroke="#4e2822" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="-20" cy="-53" rx="7" ry="10" fill="#dfc45f"/>
      <ellipse cx="20" cy="-53" rx="7" ry="10" fill="#dfc45f"/>
    </symbol>
    <symbol id="larva" viewBox="-110 -60 220 120">
      <path d="M-94 10q17-59 52-25 24-54 61-11 33-39 58 4 35-13 27 35-16 54-72 31-43 35-72 0-45 28-54-34Z" fill="url(#egg)" stroke="#41392a" stroke-width="10"/>
      <path d="M-47-6q8 34 0 54M11-19q10 35 3 61M66-12q8 27 3 49" fill="none" stroke="#929c6d" stroke-width="6" opacity=".65"/>
    </symbol>
    <symbol id="firefly" viewBox="-45 -45 90 90">
      <ellipse cy="12" rx="10" ry="22" fill="#dfff63" stroke="#071817" stroke-width="5"/>
      <ellipse cy="-11" rx="13" ry="17" fill="#173832" stroke="#071817" stroke-width="5"/>
      <path d="M-9-12Q-40-32-39-2q2 22 31 16M9-12q40-20 39 10-2 22-31 16" fill="#c9ffff" fill-opacity=".35" stroke="#347975" stroke-width="4"/>
    </symbol>
  </defs>

  <rect width="3840" height="2160" fill="url(#cavern)"/>
  <ellipse cx="1920" cy="965" rx="1180" ry="900" fill="url(#heart-glow)" opacity=".2"/>

  <!-- Upper earth ceiling and hanging roots -->
  <path d="M0 0h3840v390q-270 194-587 76-290-108-520 45-260 175-550-12-285-184-531 4-292 223-564 30-241-171-500-20-283 165-588-16Z" fill="url(#soil)"/>
  <path d="M0 0h3840v390q-270 194-587 76-290-108-520 45-260 175-550-12-285-184-531 4-292 223-564 30-241-171-500-20-283 165-588-16Z" fill="url(#soil-grain)"/>
  <g fill="none" stroke="url(#root)" stroke-linecap="round">
    <path d="M315 0q45 425 299 641t33 508" stroke-width="78"/>
    <path d="M848 0q-31 346 151 482t-32 427" stroke-width="52"/>
    <path d="M1512 0q112 330-52 590t72 510" stroke-width="66"/>
    <path d="M2360 0q-108 378 62 573t-44 479" stroke-width="62"/>
    <path d="M3031 0q32 338-160 517t57 495" stroke-width="74"/>
    <path d="M3584 0q-129 401-314 533t-16 449" stroke-width="58"/>
  </g>
  <g fill="none" stroke="#a8945c" stroke-linecap="round" opacity=".22">
    <path d="M315 0q45 425 299 641t33 508" stroke-width="12"/>
    <path d="M1512 0q112 330-52 590t72 510" stroke-width="10"/>
    <path d="M3031 0q32 338-160 517t57 495" stroke-width="12"/>
  </g>

  <!-- Carved colony walls and chambers -->
  <path d="M0 1015q412-332 808-117 308 167 595-43 251-184 517 13 267-197 518-13 287 210 595 43 396-215 807 117v1145H0Z" fill="url(#soil)" opacity=".78"/>
  <path d="M0 1015q412-332 808-117 308 167 595-43 251-184 517 13 267-197 518-13 287 210 595 43 396-215 807 117v1145H0Z" fill="url(#soil-grain)"/>

  <!-- Left and right nursery chambers -->
  <g filter="url(#depth-shadow)" stroke="#2d201a" stroke-width="30">
    <path d="M111 1172q137-330 520-318 388 12 479 365 84 324-176 522-315 240-660 27-271-168-163-596Z" fill="#1c2a20"/>
    <path d="M3729 1172q-137-330-520-318-388 12-479 365-84 324 176 522 315 240 660 27 271-168 163-596Z" fill="#1c2a20"/>
  </g>
  <path d="M128 1192q165-295 506-280 348 15 421 326 65 278-168 448-280 203-577 15-227-144-182-509Z" fill="url(#cell-pattern)" opacity=".58"/>
  <path d="M3712 1192q-165-295-506-280-348 15-421 326-65 278 168 448 280 203 577 15 227-144 182-509Z" fill="url(#cell-pattern)" opacity=".58"/>

  <!-- Central resin architecture -->
  <g filter="url(#depth-shadow)" stroke="#2a201a" stroke-linejoin="round">
    <path d="M1395 1774q104-240 207-329l36-674 92-133 70 116 120-305 120 305 70-116 92 133 36 674q103 89 207 329Z" fill="url(#resin)" stroke-width="34"/>
    <path d="M1640 772q280 123 560 0M1627 1000q293 102 586 0M1589 1283q331 106 662 0M1518 1584q402 116 804 0" fill="none" stroke="#f0d28b" stroke-width="15" opacity=".42"/>
    <path d="M1920 464v1219" stroke="#6e4934" stroke-width="22" opacity=".75"/>
    <path d="M1640 1704q280-310 560 0v126h-560Z" fill="#101712" stroke-width="28"/>
    <ellipse cx="1749" cy="1085" rx="53" ry="82" fill="#121b15" stroke-width="20"/>
    <ellipse cx="2091" cy="1085" rx="53" ry="82" fill="#121b15" stroke-width="20"/>
    <ellipse cx="1920" cy="1308" rx="71" ry="102" fill="#0d1712" stroke-width="22"/>
  </g>

