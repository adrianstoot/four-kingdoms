  <g filter="url(#glow)">
    <ellipse cx="1920" cy="884" rx="460" ry="620" fill="url(#heart-glow)" opacity=".5"/>
    <path d="M1920 291q229 168 196 463-26 227-196 430-170-203-196-430-33-295 196-463Z" fill="url(#chrysalis)" stroke="#20483d" stroke-width="26"/>
    <path d="M1768 520q152 121 304 0M1733 681q187 128 374 0M1747 849q173 116 346 0M1800 1018q120 81 240 0" fill="none" stroke="#eaff9c" stroke-width="14" opacity=".48"/>
    <path d="M1920 310q-81 187-62 392t62 463q43-258 62-463t-62-392Z" fill="#d6ee82" opacity=".22"/>
    <path d="M1891 606q29-41 58 0v208q-29 65-58 0Z" fill="#f8ffd0" opacity=".42"/>
  </g>

