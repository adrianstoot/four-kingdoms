  <g fill="none" stroke-linecap="round" filter="url(#small-glow)">
    <path d="M1918 1160q-170 184-414 230t-372 220-473 76" stroke="#80e58c" stroke-width="18" opacity=".55"/>
    <path d="M1922 1160q170 184 414 230t372 220 473 76" stroke="#80e58c" stroke-width="18" opacity=".55"/>
    <path d="M1855 1168q-35 225-217 367t-177 436" stroke="#45c99e" stroke-width="12" opacity=".48"/>
    <path d="M1985 1168q35 225 217 367t177 436" stroke="#45c99e" stroke-width="12" opacity=".48"/>
    <path d="M1704 802q-223-46-344-213t-322-190" stroke="#d8e879" stroke-width="9" opacity=".3"/>
    <path d="M2136 802q223-46 344-213t322-190" stroke="#d8e879" stroke-width="9" opacity=".3"/>
  </g>

  <!-- Larvae and eggs in nursery chambers -->
  <g filter="url(#depth-shadow)">
    <g transform="translate(450 1180)">
      <use href="#larva" x="-150" y="-70" width="300" height="165" transform="rotate(-10)"/>
      <use href="#larva" x="90" y="105" width="260" height="142" transform="rotate(19 220 176)"/>
      <use href="#larva" x="-240" y="220" width="240" height="132" transform="rotate(-19 -120 286)"/>
    </g>
    <g transform="translate(3200 1180)">
      <use href="#larva" x="-150" y="-70" width="300" height="165" transform="rotate(11)"/>
      <use href="#larva" x="-350" y="105" width="260" height="142" transform="rotate(-17 -220 176)"/>
      <use href="#larva" x="0" y="220" width="240" height="132" transform="rotate(18 120 286)"/>
    </g>
  </g>
  <g fill="url(#egg)" stroke="#3e382b" stroke-width="12" opacity=".96">
    <ellipse cx="340" cy="1510" rx="48" ry="69" transform="rotate(-18 340 1510)"/>
    <ellipse cx="625" cy="1034" rx="42" ry="61" transform="rotate(14 625 1034)"/>
    <ellipse cx="840" cy="1454" rx="46" ry="65" transform="rotate(22 840 1454)"/>
    <ellipse cx="3500" cy="1510" rx="48" ry="69" transform="rotate(18 3500 1510)"/>
    <ellipse cx="3215" cy="1034" rx="42" ry="61" transform="rotate(-14 3215 1034)"/>
    <ellipse cx="3000" cy="1454" rx="46" ry="65" transform="rotate(-22 3000 1454)"/>
  </g>

  <!-- Worker processions -->
  <g filter="url(#depth-shadow)">
    <use href="#worker-ant" x="790" y="1615" width="230" height="230" transform="rotate(33 905 1730)"/>
    <use href="#worker-ant" x="1060" y="1460" width="190" height="190" transform="rotate(39 1155 1555)"/>
    <use href="#worker-ant" x="1275" y="1320" width="150" height="150" transform="rotate(48 1350 1395)"/>
    <use href="#worker-ant" x="2820" y="1615" width="230" height="230" transform="rotate(-33 2935 1730)"/>
    <use href="#worker-ant" x="2590" y="1460" width="190" height="190" transform="rotate(-39 2685 1555)"/>
    <use href="#worker-ant" x="2415" y="1320" width="150" height="150" transform="rotate(-48 2490 1395)"/>
  </g>

  <!-- Food stores and resin pearls -->
  <g fill="#e8bd55" stroke="#50341e" stroke-width="12" filter="url(#small-glow)">
    <circle cx="968" cy="1135" r="38"/><circle cx="1048" cy="1195" r="29"/><circle cx="947" cy="1239" r="25"/>
    <circle cx="2872" cy="1135" r="38"/><circle cx="2792" cy="1195" r="29"/><circle cx="2893" cy="1239" r="25"/>
  </g>
  <g fill="#81e687" opacity=".72" filter="url(#small-glow)">
    <circle cx="1520" cy="1441" r="13"/><circle cx="1450" cy="1510" r="8"/><circle cx="1344" cy="1595" r="10"/>
    <circle cx="2320" cy="1441" r="13"/><circle cx="2390" cy="1510" r="8"/><circle cx="2496" cy="1595" r="10"/>
  </g>

  <!-- Firefly attendants orbiting the chrysalis -->
  <g filter="url(#glow)">
    <circle cx="1350" cy="655" r="100" fill="url(#heart-glow)" opacity=".35"/>
    <use href="#firefly" x="1290" y="595" width="120" height="120" transform="rotate(-18 1350 655)"/>
    <circle cx="2490" cy="655" r="100" fill="url(#heart-glow)" opacity=".35"/>
    <use href="#firefly" x="2430" y="595" width="120" height="120" transform="rotate(18 2490 655)"/>
    <circle cx="1504" cy="1052" r="70" fill="url(#heart-glow)" opacity=".3"/>
    <use href="#firefly" x="1461" y="1009" width="86" height="86"/>
    <circle cx="2336" cy="1052" r="70" fill="url(#heart-glow)" opacity=".3"/>
    <use href="#firefly" x="2293" y="1009" width="86" height="86"/>
  </g>

  <!-- High chamber amber lights -->
  <g filter="url(#glow)">
    <ellipse cx="812" cy="678" rx="185" ry="160" fill="url(#amber-glow)" opacity=".3"/>
    <circle cx="812" cy="678" r="34" fill="#f4cb6c"/>
    <ellipse cx="3028" cy="678" rx="185" ry="160" fill="url(#amber-glow)" opacity=".3"/>
    <circle cx="3028" cy="678" r="34" fill="#f4cb6c"/>
  </g>
  <g fill="#eeff8d" filter="url(#small-glow)">
    <circle cx="1170" cy="780" r="9"/><circle cx="2670" cy="780" r="9"/>
    <circle cx="990" cy="940" r="6"/><circle cx="2850" cy="940" r="6"/>
    <circle cx="1650" cy="310" r="7"/><circle cx="2190" cy="310" r="7"/>
  </g>

  <!-- Bottom foreground kept dark for the loading panel -->
  <path d="M0 1940q440-110 895-39 519 82 1025-18 506 100 1025 18 455-71 895 39v220H0Z" fill="#050907" opacity=".9"/>
  <path d="M0 0h3840v2160H0Z" fill="none" stroke="#020504" stroke-width="135" opacity=".5"/>
</svg>
