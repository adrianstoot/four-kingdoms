    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="8" dy="34"/>
      <feColorMatrix values="0 0 0 0 0.01 0 0 0 0 0.02 0 0 0 0 0.015 0 0 0 .82 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="far-blur"><feGaussianBlur stdDeviation="9"/></filter>
