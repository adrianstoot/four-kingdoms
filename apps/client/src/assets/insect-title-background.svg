      <stop offset=".38" stop-color="#12382c"/>
      <stop offset=".72" stop-color="#31533b"/>
      <stop offset="1" stop-color="#9b6b32"/>
    </linearGradient>
    <radialGradient id="sunset" cx=".77" cy=".3" r=".58">
      <stop stop-color="#ffe18c" stop-opacity=".9"/>
      <stop offset=".22" stop-color="#dda84e" stop-opacity=".48"/>
      <stop offset=".56" stop-color="#6c8a55" stop-opacity=".12"/>
      <stop offset="1" stop-color="#071712" stop-opacity="0"/>
